<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>家計簿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app/ui.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
      /* ---------- ホーム ---------- */
      .summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
      }
      .summary .label {
        font-size: 14px;
        color: var(--sub);
      }
      .summary .main {
        grid-column: 1 / -1;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .summary .value {
        font-size: 18px;
        font-weight: 700;
      }
      .budget {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .cat-row {
        padding: 8px 0;
      }
      .cat-row .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .cat-row .top .share {
        margin-left: auto;
        margin-right: 12px;
        min-width: 3em;
        text-align: right;
        color: var(--sub);
        font-size: 14px;
      }
      .cat-row .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        margin-right: 8px;
      }
      .cat-row .meter {
        height: 8px;
        margin-top: 6px;
      }
      .cat-row .child {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: var(--sub);
        padding: 2px 0 0 14px;
      }
      /* 支出全体を100%にした1本の帯 */
      .stack {
        display: flex;
        gap: 3px;
        height: 18px;
        margin-bottom: 10px;
      }
      .stack > div {
        min-width: 4px;
        border-radius: 999px;
      }

      /* ---------- 履歴 ---------- */
      .date-head {
        font-size: 14px;
        color: var(--sub);
        margin: 14px 0 2px;
      }
      .date-head:first-child {
        margin-top: 0;
      }
      .entry {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 8px 12px;
        margin: 0 -12px;
        width: calc(100% + 24px);
        border: none;
        border-radius: var(--radius-sm);
        background: none;
        text-align: left;
      }
      .entry:active {
        background: var(--bg);
      }
      .entry .meta {
        display: block;
        font-size: 13px;
        color: var(--sub);
      }
      .entry .amount {
        font-weight: 700;
      }

      /* ---------- カテゴリと日付のボタン ---------- */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      .chip {
        min-height: 44px;
        padding: 0 16px;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
      }
      .chip.child {
        font-size: 15px;
        color: var(--sub);
      }
      .chip.on {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--ink);
        font-weight: 700;
      }

      /* ---------- 設定のカテゴリ一覧 ---------- */
      .cat-item {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 56px;
        border-bottom: 1px solid var(--line);
      }
      .cat-item:last-child {
        border-bottom: none;
      }
      .cat-item.child {
        padding-left: 20px;
      }
      .cat-item .name {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        padding: 4px 0;
        border: none;
        background: none;
        text-align: left;
      }
      .cat-item .name small {
        display: block;
        font-size: 13px;
        color: var(--sub);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cat-item .move {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 999px;
        background: var(--bg);
        color: var(--sub);
        font-size: 18px;
      }
      .cat-item .move:disabled {
        opacity: 0.3;
      }

      /* ---------- 記録ボタンと、下から出る入力欄 ---------- */
      #fab {
        position: fixed;
        right: 16px;
        bottom: calc(76px + env(safe-area-inset-bottom));
        z-index: 6;
        min-height: 56px;
        padding: 0 26px;
        box-shadow: 0 4px 14px rgba(6, 184, 96, 0.35);
        font-size: 17px;
      }
      dialog.sheet {
        width: 100%;
        max-width: 640px;
        max-height: 92vh;
        margin: auto auto 0;
        padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
        border: none;
        border-radius: 24px 24px 0 0;
        background: var(--surface);
        overflow-y: auto;
      }
      dialog.sheet::backdrop {
        background: rgba(0, 0, 0, 0.35);
      }
      dialog.sheet[open] {
        animation: up 0.22s ease-out;
      }
      @keyframes up {
        from {
          transform: translateY(40px);
          opacity: 0.6;
        }
      }
      .grabber {
        width: 40px;
        height: 5px;
        border-radius: 999px;
        background: var(--line);
        margin: 0 auto 12px;
      }
      .sheet h3 {
        font-size: 18px;
        margin: 0 0 14px;
      }
      .amount-field {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1.5px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 0 16px;
        margin-bottom: 14px;
      }
      .amount-field:focus-within {
        border-color: var(--green);
      }
      .amount-field span {
        font-size: 24px;
        color: var(--sub);
      }
      .amount-field input {
        border: none;
        padding: 8px 0;
        min-height: 64px;
        font-size: 30px;
        font-weight: 700;
      }
      .sheet .actions {
        display: grid;
        gap: 8px;
        margin-top: 6px;
      }
      .sheet .actions.two {
        grid-template-columns: 1fr 2fr;
      }
    </style>
  </head>
  <body>
    <header id="monthbar">
      <div class="month-switch">
        <button id="prev" aria-label="前の月">‹</button>
        <h1 id="month">—</h1>
        <button id="next" aria-label="次の月">›</button>
      </div>
    </header>

    <main>
      <div id="status">読み込み中…</div>

      <!-- ホーム -->
      <div class="tab on" id="tab-home">
        <section class="card">
          <div class="summary">
            <div class="label">この月の支出</div>
            <div class="main num expense" id="s-expense"></div>
            <div class="label">収入</div>
            <div class="label">収支</div>
            <div class="value num income" id="s-income"></div>
            <div class="value num" id="s-balance"></div>
          </div>
          <div class="budget" id="budget-box">
            <div class="inline" style="justify-content: space-between">
              <span>予算の残り</span><strong class="num" id="budget-left"></strong>
            </div>
            <div class="meter" id="budget-bar"><div></div></div>
            <div class="muted" id="budget-text" style="margin-top: 6px"></div>
          </div>
        </section>
        <section class="card">
          <h2>日ごとの支出</h2>
          <div class="chart-box"><canvas id="c-daily"></canvas></div>
        </section>
        <section class="card">
          <h2>カテゴリ別</h2>
          <div id="cat-list"></div>
        </section>
      </div>

      <!-- 推移 -->
      <div class="tab" id="tab-trend">
        <section class="card">
          <h2>この半年の支出と収入</h2>
          <div class="chart-box" style="height: 230px"><canvas id="c-trend"></canvas></div>
        </section>
        <section class="card">
          <h2>月ごとの比較</h2>
          <table id="trend-table"></table>
        </section>
      </div>

      <!-- 履歴 -->
      <div class="tab" id="tab-list">
        <section class="card">
          <h2>この月の記録</h2>
          <div id="entries"></div>
        </section>
      </div>

      <!-- 設定 -->
      <div class="tab" id="tab-settings">
        <section class="card">
          <h2>月の予算</h2>
          <div class="inline">
            <input id="budget-input" type="number" inputmode="numeric" placeholder="なし" aria-label="月の予算" />
            <button class="btn" id="budget-save">保存</button>
          </div>
          <p class="muted" style="margin: 8px 0 0">空にすると予算を出しません。</p>
        </section>
        <section class="card">
          <label class="switch">
            <span>記録していない日は、夜9時に LINE で知らせる</span>
            <input id="remind" type="checkbox" />
          </label>
        </section>
        <section class="card">
          <h2>支出のカテゴリ</h2>
          <div id="cats-expense"></div>
        </section>
        <section class="card">
          <h2>収入のカテゴリ</h2>
          <div id="cats-income"></div>
        </section>
        <button class="btn raised wide" id="cat-new" style="margin-bottom: 12px">カテゴリを追加</button>
        <section class="card">
          <h2>シフト収入</h2>
          <a class="btn soft wide" href="/app/shift">シフト収入を開く</a>
        </section>
        <section class="card">
          <h2>データ</h2>
          <button class="btn soft wide" id="export">CSV で書き出す</button>
        </section>
      </div>
    </main>

    <button class="btn" id="fab">＋ 記録する</button>
    <div id="toast" role="status" aria-live="polite"></div>

    <nav>
      <button data-tab="home" class="on">ホーム</button>
      <button data-tab="trend">推移</button>
      <button data-tab="list">履歴</button>
      <button data-tab="settings">設定</button>
    </nav>

    <!-- 記録の入力（追加・編集） -->
    <dialog class="sheet" id="entry-sheet">
      <form method="dialog" id="entry-form">
        <div class="grabber"></div>
        <h3 id="es-title">記録する</h3>
        <div class="segment" id="es-type">
          <button type="button" data-type="expense" class="on">支出</button>
          <button type="button" data-type="income">収入</button>
        </div>
        <div class="amount-field">
          <span>¥</span>
          <input id="es-amount" type="number" inputmode="numeric" placeholder="0" aria-label="金額" />
        </div>
        <div class="chips" id="es-cats"></div>
        <div class="chips" id="es-dates">
          <button type="button" class="chip" data-day="0">今日</button>
          <button type="button" class="chip" data-day="-1">昨日</button>
          <input
            id="es-date"
            type="date"
            aria-label="日付"
            style="width: auto; min-height: 44px; border-radius: 999px"
          />
        </div>
        <label class="field"><span>メモ（なくてもよい）</span><input id="es-memo" /></label>
        <div class="actions" id="es-actions">
          <button type="button" class="btn danger" id="es-delete">削除</button>
          <button type="submit" class="btn" value="save">保存</button>
        </div>
        <button type="button" class="btn text wide" data-close>閉じる</button>
      </form>
    </dialog>

    <!-- カテゴリの追加・編集 -->
    <dialog class="sheet" id="cat-sheet">
      <form method="dialog" id="cat-form">
        <div class="grabber"></div>
        <h3 id="cs-title">カテゴリを追加</h3>
        <div class="segment" id="cs-type">
          <button type="button" data-type="expense" class="on">支出</button>
          <button type="button" data-type="income">収入</button>
        </div>
        <label class="field"><span>名前</span><input id="cs-name" maxlength="20" /></label>
        <label class="field"
          ><span>どのカテゴリの中に入れるか</span>
          <select id="cs-parent"></select>
        </label>
        <label class="field"
          ><span>このカテゴリにする言葉（「ランチ, コンビニ」のように、なくてもよい）</span>
          <input id="cs-keywords" />
        </label>
        <div class="actions" id="cs-actions">
          <button type="button" class="btn danger" id="cs-delete">削除</button>
          <button type="submit" class="btn">保存</button>
        </div>
        <button type="button" class="btn text wide" data-close>閉じる</button>
      </form>
    </dialog>

    <script>
      const LIFF_ID = '__LIFF_ID__';
      // カテゴリの色（多い順に使う。8番目より後はすべて灰色）
      const CAT_COLORS = ['#f28b8f', '#6cc3e6', '#f5c45e', '#7fd3a0', '#b39be8', '#f4a66e', '#e99ac8', '#c3c9d1'];
      const $ = (id) => document.getElementById(id);
      const yen = (n) => (n < 0 ? '-¥' : '¥') + Math.abs(n).toLocaleString('ja-JP');
      let token = null,
        data = null,
        month = null,
        charts = {};

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }

      let toastTimer = null;
      function toast(message) {
        $('toast').textContent = message;
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
      }

      async function api(path, opts = {}) {
        const res = await fetch('/api' + path, {
          ...opts,
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token, ...(opts.headers || {}) },
        });
        if (res.status === 401) {
          liff.login();
          throw new Error('unauthorized');
        }
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          toast(e.error || 'うまくいきませんでした。もう一度試してください');
          throw new Error(res.status);
        }
        return path.endsWith('.csv') ? res.blob() : res.json();
      }

      async function init() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        token = liff.getIDToken();
        await load();
      }

      async function load() {
        data = await api('/summary' + (month ? '?month=' + month : ''));
        month = data.month;
        $('status').style.display = 'none';
        render();
      }

      // ---------- 表示 ----------
      function render() {
        const [y, m] = month.split('-');
        $('month').textContent = `${y}年${Number(m)}月`;
        $('next').style.visibility = month >= data.today.slice(0, 7) ? 'hidden' : 'visible';

        $('s-expense').textContent = yen(data.expense);
        $('s-income').textContent = yen(data.income);
        $('s-balance').textContent = yen(data.income - data.expense);
        if (data.budget > 0) {
          const rate = data.expense / data.budget;
          $('budget-box').style.display = '';
          $('budget-left').textContent = yen(data.budget - data.expense);
          $('budget-left').className = 'num ' + (rate > 1 ? 'expense' : '');
          $('budget-text').textContent = `予算 ${yen(data.budget)} のうち ${Math.round(rate * 100)}% を使いました`;
          $('budget-bar').classList.toggle('over', rate > 1);
          $('budget-bar').firstElementChild.style.width = Math.min(100, rate * 100) + '%';
        } else {
          $('budget-box').style.display = 'none';
        }

        drawChart('daily', $('c-daily'), {
          type: 'bar',
          data: {
            labels: data.daily.map((_, i) => i + 1),
            datasets: [{ data: data.daily, backgroundColor: '#f2a1a3', borderRadius: 6, borderSkipped: false }],
          },
          options: baseOpts({ x: { ticks: { maxTicksLimit: 8 } } }),
        });

        // 支出に占める割合：上に1本の帯、下にカテゴリごとの割合と金額
        const total = data.expense || 1;
        const color = (i) => CAT_COLORS[i] ?? CAT_COLORS.at(-1);
        const pct = (v) => Math.round((v / total) * 100);
        $('cat-list').innerHTML = data.groups.length
          ? `<div class="stack">${data.groups
              .map((g, i) => `<div style="flex:${g.total};background:${color(i)}" title="${esc(g.name)}"></div>`)
              .join('')}</div>` +
            data.groups
              .map(
                (g, i) => `<div class="cat-row">
          <div class="top"><span><span class="dot" style="background:${color(i)}"></span>${esc(g.name)}</span>
            <span class="share num">${pct(g.total)}%</span><span class="num">${yen(g.total)}</span></div>
          <div class="meter"><div style="width:${pct(g.total)}%;background:${color(i)}"></div></div>
          ${g.children.map((c) => `<div class="child"><span>${esc(c.name)}</span><span class="num">${yen(c.amount)}</span></div>`).join('')}
        </div>`,
              )
              .join('')
          : '<p class="muted">まだ記録がありません。下の「＋ 記録する」から付けられます。</p>';

        drawChart('trend', $('c-trend'), {
          type: 'bar',
          data: {
            labels: data.trend.map((t) => Number(t.month.slice(5)) + '月'),
            datasets: [
              { label: '支出', data: data.trend.map((t) => t.expense), backgroundColor: '#f2a1a3', borderRadius: 6 },
              { label: '収入', data: data.trend.map((t) => t.income), backgroundColor: '#7fd8a8', borderRadius: 6 },
            ],
          },
          options: { ...baseOpts(), plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } } },
        });
        $('trend-table').innerHTML =
          '<tr><th></th><th class="num">支出</th><th class="num">収入</th><th class="num">収支</th></tr>' +
          data.trend
            .slice()
            .reverse()
            .map(
              (t) => `<tr><td>${Number(t.month.slice(5))}月</td><td class="num">${yen(t.expense)}</td>
      <td class="num">${yen(t.income)}</td><td class="num ${t.income - t.expense < 0 ? 'expense' : ''}">${yen(t.income - t.expense)}</td></tr>`,
            )
            .join('');

        renderEntries();
        renderSettings();
      }

      function renderEntries() {
        const byDate = {};
        for (const e of data.entries) (byDate[e.date] ||= []).push(e);
        $('entries').innerHTML =
          Object.keys(byDate)
            .map((d) => {
              const wd = '日月火水木金土'[new Date(d + 'T00:00:00').getDay()];
              return (
                `<div class="date-head">${Number(d.slice(5, 7))}月${Number(d.slice(8))}日（${wd}）</div>` +
                byDate[d]
                  .map((e) => {
                    const meta =
                      [e.store, e.memo].filter(Boolean).join(' ') + (e.source === 'receipt' ? '（レシート）' : '');
                    return `<button class="entry" onclick="openEntry(${e.id})">
          <span>${esc(e.category)}${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</span>
          <span class="amount num ${e.type}">${e.type === 'income' ? '+' : ''}${yen(e.amount)}</span></button>`;
                  })
                  .join('')
              );
            })
            .join('') || '<p class="muted">この月の記録はありません。</p>';
      }

      /** 同じ親を持つカテゴリ（並び替えはこの中で） */
      const siblings = (c) => data.categories.filter((x) => x.type === c.type && x.parentId === c.parentId);
      const parentOf = (c) => data.categories.find((x) => x.id === c.parentId);

      function renderSettings() {
        $('budget-input').value = data.budget || '';
        $('remind').checked = data.remind;
        for (const type of ['expense', 'income']) {
          $('cats-' + type).innerHTML = data.categories
            .filter((c) => c.type === type)
            .map((c) => {
              const sibs = siblings(c);
              const i = sibs.indexOf(c);
              return `<div class="cat-item ${c.parentId ? 'child' : ''}">
          <button class="name" onclick="openCategory(${c.id})">${esc(c.name)}${c.keywords ? `<small>${esc(c.keywords)}</small>` : ''}</button>
          <button class="move" aria-label="上へ" onclick="moveCat(${c.id}, -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="move" aria-label="下へ" onclick="moveCat(${c.id}, 1)" ${i === sibs.length - 1 ? 'disabled' : ''}>↓</button>
        </div>`;
            })
            .join('');
        }
      }

      function baseOpts(scales = {}) {
        return {
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => yen(c.raw) } } },
          scales: {
            x: { grid: { display: false }, border: { display: false }, ...(scales.x || {}) },
            y: {
              grid: { color: '#eef0f2' },
              border: { display: false },
              ticks: { callback: (v) => (v >= 10000 ? v / 10000 + '万' : v) },
            },
          },
        };
      }

      function drawChart(key, canvas, cfg) {
        if (charts[key]) charts[key].destroy();
        charts[key] = new Chart(canvas, cfg);
      }

      // ---------- 記録の入力 ----------
      let editing = null; // 編集中の記録（新しく記録するときは null）
      let entryType = 'expense';
      let entryCat = null;

      function selectType(type) {
        entryType = type;
        for (const b of $('es-type').children) b.classList.toggle('on', b.dataset.type === type);
        renderCatChips();
      }

      /** よく使う親カテゴリを前に。子は親のすぐ後ろ */
      function renderCatChips() {
        const list = data.categories.filter((c) => c.type === entryType);
        const used = {};
        for (const e of data.entries) {
          const c = list.find((x) => x.name === e.category);
          const top = c && c.parentId ? c.parentId : c?.id;
          if (top) used[top] = (used[top] || 0) + 1;
        }
        const tops = list.filter((c) => !c.parentId).sort((a, b) => (used[b.id] || 0) - (used[a.id] || 0));
        const ordered = tops.flatMap((t) => [t, ...list.filter((c) => c.parentId === t.id)]);
        if (!ordered.some((c) => c.name === entryCat)) entryCat = ordered[0]?.name ?? null;
        $('es-cats').innerHTML = ordered
          .map(
            (c) =>
              `<button type="button" class="chip ${c.parentId ? 'child' : ''} ${c.name === entryCat ? 'on' : ''}" data-cat="${esc(c.name)}">${c.parentId ? '› ' : ''}${esc(c.name)}</button>`,
          )
          .join('');
      }

      function shiftDay(days) {
        const d = new Date(data.today + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() + days);
        return d.toISOString().slice(0, 10);
      }
      function selectDate(date) {
        $('es-date').value = date;
        for (const b of $('es-dates').querySelectorAll('.chip')) {
          b.classList.toggle('on', shiftDay(Number(b.dataset.day)) === date);
        }
      }

      function openEntrySheet(entry) {
        editing = entry;
        $('es-title').textContent = entry ? '記録を直す' : '記録する';
        entryCat = entry ? entry.category : null;
        selectType(entry ? entry.type : 'expense');
        $('es-amount').value = entry ? entry.amount : '';
        $('es-memo').value = entry ? entry.memo : '';
        // 前の月を見ているときは、その月の最終日（今日より前）を初めの日付にする
        const viewing =
          month === data.today.slice(0, 7)
            ? data.today
            : `${month}-${new Date(month.slice(0, 4), month.slice(5), 0).getDate()}`;
        selectDate(entry ? entry.date : viewing);
        $('es-delete').style.display = entry ? '' : 'none';
        $('es-delete').textContent = '削除';
        $('es-actions').classList.toggle('two', !!entry);
        $('entry-sheet').showModal();
        $('es-amount').focus();
      }
      window.openEntry = (id) => openEntrySheet(data.entries.find((x) => x.id === id));
      $('fab').onclick = () => openEntrySheet(null);

      $('es-type').onclick = (ev) => ev.target.dataset.type && selectType(ev.target.dataset.type);
      $('es-cats').onclick = (ev) => {
        const b = ev.target.closest('[data-cat]');
        if (!b) return;
        entryCat = b.dataset.cat;
        for (const x of $('es-cats').children) x.classList.toggle('on', x === b);
      };
      $('es-dates').onclick = (ev) => ev.target.dataset.day && selectDate(shiftDay(Number(ev.target.dataset.day)));
      $('es-date').onchange = () => selectDate($('es-date').value);

      $('entry-form').onsubmit = async (ev) => {
        ev.preventDefault();
        const amount = Math.round(Number($('es-amount').value));
        if (!amount || amount <= 0) {
          $('es-amount').focus();
          return toast('金額を入れてください');
        }
        const body = {
          type: entryType,
          category: entryCat,
          amount,
          date: $('es-date').value,
          memo: $('es-memo').value,
        };
        if (editing) await api('/entries/' + editing.id, { method: 'PATCH', body: JSON.stringify(body) });
        else await api('/entries', { method: 'POST', body: JSON.stringify(body) });
        $('entry-sheet').close();
        toast(editing ? '直しました' : `${entryCat} ${yen(amount)} を記録しました`);
        await load();
      };
      // 削除は2回押す（間違えて消さないように）
      $('es-delete').onclick = async () => {
        if ($('es-delete').textContent === '削除') {
          $('es-delete').textContent = 'もう一度押すと削除';
          return;
        }
        await api('/entries/' + editing.id, { method: 'DELETE' });
        $('entry-sheet').close();
        toast('削除しました');
        await load();
      };

      // ---------- カテゴリの入力 ----------
      let editingCat = null;
      let catType = 'expense';

      function selectCatType(type) {
        catType = type;
        for (const b of $('cs-type').children) b.classList.toggle('on', b.dataset.type === type);
        const tops = data.categories.filter((c) => c.type === type && !c.parentId && c.id !== editingCat?.id);
        $('cs-parent').innerHTML =
          '<option value="0">どこにも入れない（一番上）</option>' +
          tops.map((c) => `<option value="${c.id}">${esc(c.name)} の中</option>`).join('');
        $('cs-parent').value = String(editingCat?.parentId || 0);
      }

      function openCategorySheet(c) {
        editingCat = c;
        $('cs-title').textContent = c ? 'カテゴリを直す' : 'カテゴリを追加';
        $('cs-type').style.display = c ? 'none' : '';
        selectCatType(c ? c.type : 'expense');
        $('cs-name').value = c ? c.name : '';
        $('cs-keywords').value = c ? c.keywords : '';
        // 子を持つカテゴリは、ほかの中に入れられない（2段まで）
        $('cs-parent').disabled = !!c && data.categories.some((x) => x.parentId === c.id);
        $('cs-delete').style.display = c ? '' : 'none';
        $('cs-delete').textContent = '削除';
        $('cs-actions').classList.toggle('two', !!c);
        $('cat-sheet').showModal();
        if (!c) $('cs-name').focus();
      }
      window.openCategory = (id) => openCategorySheet(data.categories.find((x) => x.id === id));
      $('cat-new').onclick = () => openCategorySheet(null);
      $('cs-type').onclick = (ev) => ev.target.dataset.type && selectCatType(ev.target.dataset.type);

      $('cat-form').onsubmit = async (ev) => {
        ev.preventDefault();
        const name = $('cs-name').value.trim();
        if (!name) return toast('名前を入れてください');
        const body = { name, keywords: $('cs-keywords').value, parentId: Number($('cs-parent').value) };
        if (editingCat) await api('/categories/' + editingCat.id, { method: 'PATCH', body: JSON.stringify(body) });
        else await api('/categories', { method: 'POST', body: JSON.stringify({ ...body, type: catType }) });
        $('cat-sheet').close();
        toast(editingCat ? '直しました' : `「${name}」を追加しました`);
        await load();
      };
      $('cs-delete').onclick = async () => {
        if ($('cs-delete').textContent === '削除') {
          const hasChildren = data.categories.some((x) => x.parentId === editingCat.id);
          $('cs-delete').textContent = hasChildren
            ? 'もう一度押すと削除（中のカテゴリは一番上へ）'
            : 'もう一度押すと削除';
          return;
        }
        await api('/categories/' + editingCat.id, { method: 'DELETE' });
        $('cat-sheet').close();
        toast('削除しました（これまでの記録は残ります）');
        await load();
      };

      window.moveCat = async (id, d) => {
        const c = data.categories.find((x) => x.id === id);
        const list = siblings(c);
        const i = list.indexOf(c);
        [list[i], list[i + d]] = [list[i + d], list[i]];
        await api('/categories/order', { method: 'PUT', body: JSON.stringify({ ids: list.map((x) => x.id) }) });
        await load();
      };

      // 「閉じる」と、背景を押したときに閉じる
      for (const dlg of document.querySelectorAll('dialog.sheet')) {
        dlg.querySelector('[data-close]').onclick = () => dlg.close();
        dlg.addEventListener('click', (ev) => ev.target === dlg && dlg.close());
      }

      // ---------- 設定 ----------
      $('budget-save').onclick = async () => {
        const amount = Number($('budget-input').value) || 0;
        await api('/budget', { method: 'PUT', body: JSON.stringify({ amount }) });
        toast(amount ? `予算を ${yen(amount)} にしました` : '予算を出さないようにしました');
        await load();
      };
      $('remind').onchange = async () => {
        await api('/remind', { method: 'PUT', body: JSON.stringify({ on: $('remind').checked }) });
        data.remind = $('remind').checked;
        toast(data.remind ? '記録忘れの通知をオンにしました' : '記録忘れの通知をオフにしました');
      };
      $('export').onclick = async () => {
        const blob = await api('/export.csv');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'kakeibo.csv';
        a.click();
        URL.revokeObjectURL(url);
      };

      // ---------- 月とタブ ----------
      function shiftMonth(m, n) {
        const [y, mo] = m.split('-').map(Number);
        const d = new Date(y, mo - 1 + n, 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      }
      $('prev').onclick = () => {
        month = shiftMonth(month, -1);
        load();
      };
      $('next').onclick = () => {
        month = shiftMonth(month, 1);
        load();
      };
      document.querySelectorAll('nav button').forEach(
        (b) =>
          (b.onclick = () => {
            document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
            document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.id === 'tab-' + b.dataset.tab));
            const settings = b.dataset.tab === 'settings';
            $('monthbar').style.display = settings ? 'none' : '';
            $('fab').style.display = settings ? 'none' : '';
            window.scrollTo(0, 0);
          }),
      );

      init().catch((e) => {
        $('status').textContent = '読み込めませんでした：' + e.message;
      });
    </script>
  </body>
</html>
