name = "line-kakeibo-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# LIFF画面(HTML)を文字列としてimportする
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# 毎朝8時（日本時間）に給料日の通知を送る。cron は UTC で書く
[triggers]
crons = ["0 23 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kakeibo"
database_id = "834047d8-bd46-47a4-843a-a2223f6a2350"

[vars]
LIFF_ID = "2012810933-rTm4Ah4U"
LOGIN_CHANNEL_ID = "2012810933"
# 左から順に試し、混雑・回数上限・時間切れなら次のモデルで読む
RECEIPT_MODEL = "gemini-3.5-flash-lite,gemini-3.8-flash"

# シークレットは以下で登録（tomlには書かない）
# wrangler secret put LINE_CHANNEL_SECRET
# wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
# wrangler secret put GEMINI_API_KEY  (Google AI Studio で作るキー。無料枠)
# wrangler secret put ICAL_ENCRYPTION_KEY  (シフト収入のカレンダーURLを暗号化する鍵。作り方は README)
