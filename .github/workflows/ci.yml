name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI では git フックを入れない
  LEFTHOOK: 0

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # 本番には出さず、ボットと MCP サーバーの2つの Worker をバンドルできるかだけ確かめる
      - run: npm run build

  # 秘密が混ざっていないかを履歴ごと調べる。公開リポジトリならpushした時点で誰でも見られる
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
